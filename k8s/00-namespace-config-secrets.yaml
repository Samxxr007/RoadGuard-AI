apiVersion: v1
kind: Namespace
metadata:
  name: roadguard
  labels:
    app.kubernetes.io/name: roadguard
    app.kubernetes.io/part-of: smart-city-infrastructure
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: roadguard-config
  namespace: roadguard
data:
  ENVIRONMENT: "production"
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "roadguard"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  AI_SERVICE_URL: "http://roadguard-ai:8001"
  CONFIDENCE_THRESHOLD: "0.65"
  FRAME_INTERVAL: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: roadguard-secrets
  namespace: roadguard
type: Opaque
stringData:
  POSTGRES_USER: "roadguard"
  POSTGRES_PASSWORD: "roadguard_secure_password_2026"
  JWT_SECRET: "roadguard_jwt_super_secret_key_2026_capstone"
