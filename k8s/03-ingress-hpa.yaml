apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roadguard-ingress
  namespace: roadguard
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  rules:
    - host: roadguard.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: roadguard-backend
                port:
                  number: 8000
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: roadguard-ai
                port:
                  number: 8001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: roadguard-frontend
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: roadguard-ai-hpa
  namespace: roadguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: roadguard-ai
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: roadguard-backend-hpa
  namespace: roadguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: roadguard-backend
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
